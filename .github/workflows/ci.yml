name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck stow tmux zsh

      - name: Check shell syntax and style
        run: |
          bash -n setup.sh tests/test-installer.sh scripts/codex-popup
          zsh -n zsh/.zshrc
          shellcheck setup.sh tests/test-installer.sh scripts/codex-popup

      - name: Parse tmux configuration
        run: |
          tmux -L dotfiles-ci -f /dev/null new-session -d -s config-test \; \
            source-file "$PWD/tmux/.tmux.conf" \; kill-server

      - name: Install pinned Neovim
        run: |
          curl -fL --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz \
            -o /tmp/nvim.tar.gz
          echo 'bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875  /tmp/nvim.tar.gz' |
            sha256sum --check
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo '/tmp/nvim-linux-x86_64/bin' >> "$GITHUB_PATH"

      - name: Test prerequisites, idempotence, backup and restore
        run: ./tests/test-installer.sh

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check nvim/.config/nvim

      - name: Start Neovim headlessly
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/nvim/.config
        run: |
          nvim --headless '+Lazy! sync' +qa
          nvim --headless '+checkhealth kickstart' +qa

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create an unprivileged user on a minimal system
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends sudo
          useradd --create-home --shell /bin/bash dotfiles-test
          printf 'dotfiles-test ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/dotfiles-test
          chmod 440 /etc/sudoers.d/dotfiles-test
          cp -a "$GITHUB_WORKSPACE" /home/dotfiles-test/dotfiles
          chown -R dotfiles-test:dotfiles-test /home/dotfiles-test/dotfiles

      - name: Bootstrap without Zsh or Node preinstalled
        run: sudo --user=dotfiles-test --set-home bash -lc 'cd ~/dotfiles && ./setup.sh bootstrap'

      - name: Check installed tools and a repeated installation
        run: |
          sudo --user=dotfiles-test --set-home bash -lc 'cd ~/dotfiles && ./setup.sh bootstrap && ./setup.sh doctor'
          sudo --user=dotfiles-test --set-home bash -lc 'cd ~/dotfiles && ./tests/test-installer.sh'

  powershell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Test JSONC-preserving Windows Terminal update
        shell: pwsh
        run: ./tests/test-jsonc.ps1
