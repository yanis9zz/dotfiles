# ------------------------------------------------------------
# General
# ------------------------------------------------------------

# Always start zsh in new panes/windows
set -g default-command "exec zsh"

# Advertise true color correctly to applications such as Neovim.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Forward OSC 52 clipboard sequences from applications to the terminal.
set -s set-clipboard on

# Mouse support
set -g mouse on

# Larger scrollback history
set -g history-limit 100000

# Reduce delay when leaving insert mode in Neovim/Vim
set -sg escape-time 10

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# When a window disappears, remove gaps in numbering
set -g renumber-windows on


# ------------------------------------------------------------
# Copy mode
# ------------------------------------------------------------

# Vim-like keys in copy mode
setw -g mode-keys vi


# ------------------------------------------------------------
# Splits
# ------------------------------------------------------------

# More intuitive split shortcuts:
#
# Prefix + | -> vertical split
# Prefix + - -> horizontal split

unbind '"'
unbind %

bind s split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"


# ------------------------------------------------------------
# Pane navigation
# ------------------------------------------------------------

# Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ------------------------------------------------------------
# New windows
# ------------------------------------------------------------

# New windows inherit the current working directory
bind c new-window -c "#{pane_current_path}"


# ------------------------------------------------------------
# Config
# ------------------------------------------------------------

# Hide or show status bar
bind b set -g status

# Prefix + r reloads this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Open the same persistent Codex workspace popup for the current project.
bind C run-shell "$HOME/config/scripts/codex-popup"
